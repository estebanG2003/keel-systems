<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel Systems</title>
<meta name="description" content="I build the software that does it instead. Quotes, callbacks, forms, reports, the same answer typed for the hundredth time.">
<meta property="og:title" content="Keel Systems">
<meta property="og:description" content="I build the software that does it instead. Quotes, callbacks, forms, reports, the same answer typed for the hundredth time.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_CA">
<meta property="og:locale:alternate" content="fr_CA">
<meta property="og:locale:alternate" content="es_CO">
<meta property="og:url" content="https://estebang2003.github.io/keel-systems/">
<meta property="og:image" content="https://estebang2003.github.io/keel-systems/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #f6f4f0; --fg: #14212b; --muted: #55636e;
    /* --rule is decorative (cards, dividers). --control is for anything the
       user can press, which WCAG 1.4.11 requires to clear 3:1 against the
       background so a button reads as a button. Measured, not guessed. */
    --rule: #cfc8bc; --control: #948a78;
    --card: #ffffff; --ink: #10333f; --ink-fg: #eef5f7; --ink-muted: #a9c3cc;
    /* Desaturated on purpose. A near-white button on the dark hero reads as
       glare, so --hero-btn is a muted slate instead, and the accents are
       pulled back. Every value still measured against the floors above. */
    --accent: #33606b; --accent-soft: #eaf0f1; --warm: #a87f62;
    --on-accent: #ffffff; --on-warm: #2a1508; --hero-btn: #c8d9de;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161a; --fg: #e8eaec; --muted: #939ea6;
      --rule: #3a4750; --control: #5e6d78;
      --card: #171f25; --ink: #1e4351; --ink-fg: #e9f2f5; --ink-muted: #a6c4ce;
      --accent: #7fb2bd; --accent-soft: #1a2f37; --warm: #c9a184;
      --on-accent: #06181f; --on-warm: #2a1508; --hero-btn: #cddde2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

  .langbar { display: flex; gap: .3rem; justify-content: flex-end; margin-bottom: 1.25rem; }
  .langbar button {
    font: inherit; font-size: .78rem; font-weight: 600; letter-spacing: .07em;
    padding: .55rem .8rem; background: none; color: var(--muted);
    border: 1px solid var(--control); border-radius: 999px; cursor: pointer;
  }
  .langbar button[aria-pressed="true"] {
    color: var(--on-accent); background: var(--accent); border-color: var(--accent);
  }

  /* Hero panel: the colour anchor. Kept distinct from --bg in BOTH schemes. */
  .hero {
    background: var(--ink); color: var(--ink-fg);
    border-radius: 1rem; padding: 2.5rem 1.5rem 2rem;
    background-image: radial-gradient(120% 90% at 100% 0%, rgba(120,200,220,.20), transparent 60%);
  }
  .hero h1 {
    font-size: clamp(1.75rem, 5.6vw, 2.5rem); line-height: 1.18;
    letter-spacing: -.02em; margin: 0 0 .9rem; color: var(--ink-fg);
  }
  .hero .sub { font-size: 1.05rem; color: var(--ink-muted); margin: 0 0 1.75rem; }

  section { margin-top: 3rem; }
  h2 { font-size: 1.3rem; letter-spacing: -.01em; margin: 0 0 .75rem; }
  .lead { font-size: 1.05rem; font-weight: 600; margin: 0 0 1.25rem; }

  /* Triggers are the OWNER speaking, not us. Quotes + italics mark the voice change. */
  ul.triggers { list-style: none; padding: 0; margin: 0 0 1.25rem; }
  ul.triggers li {
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    border-radius: 0 .4rem .4rem 0; padding: .6rem .85rem;
    margin-bottom: .45rem; font-size: .97rem; line-height: 1.5; font-style: italic;
  }
  ul.triggers li::before { content: "\201C"; }
  ul.triggers li::after { content: "\201D"; }
  @media (min-width: 40rem) {
    ul.triggers { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
    ul.triggers li { margin-bottom: 0; }
  }
  .close { color: var(--muted); margin: 0; }

  ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; }
  ol.steps li { counter-increment: s; padding-left: 2.9rem; position: relative; margin-bottom: 1.5rem; }
  ol.steps li::before {
    content: counter(s); position: absolute; left: 0; top: 0;
    width: 2rem; height: 2rem; border-radius: 50%;
    background: var(--warm); color: var(--on-warm);
    display: grid; place-items: center; font-size: .95rem; font-weight: 700;
  }
  ol.steps .t { font-weight: 700; display: block; margin-bottom: .15rem; }
  ol.steps .b { color: var(--muted); }

  .cta { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.5rem; }
  .cta a {
    display: inline-block; padding: .85rem 1.4rem; border-radius: .5rem;
    text-decoration: none; font-weight: 700; overflow-wrap: anywhere;
  }
  .cta a.primary { background: var(--accent); color: var(--on-accent); }
  .cta a.secondary { border: 1px solid var(--control); color: var(--fg); font-weight: 600; }
  /* Muted slate rather than near-white: still well past 4.5:1 on the dark
     panel, without the glare of maximum contrast. */
  .hero .cta { margin-top: 0; }
  .hero .cta a.primary { background: var(--hero-btn); color: var(--ink); }
  .hero .cta a.secondary { border-color: rgba(255,255,255,.22); color: var(--ink-muted); font-weight: 500; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Buttons are static so a JS load failure still leaves the reader a way to switch language. init() re-renders them. -->
    <nav class="langbar" id="langbar" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </nav>
    <main id="app">
      <div class="hero">
        <h1>Every business has that one thing somebody does by hand every week.</h1>
        <p class="sub">I build the software that does it instead. Quotes, callbacks, forms, reports, the same answer typed for the hundredth time.</p>
        <div class="cta">
          <a class="primary" href="https://wa.me/18195002323">Start with a conversation</a>
          <a class="secondary" href="mailto:esteban.gomez2003@gmail.com">esteban.gomez2003@gmail.com</a>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
